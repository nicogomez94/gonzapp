previews:
  generation: off

services:
  - type: web
    name: z-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_API_URL
        value: https://z-api.onrender.com/api
      - key: VITE_DEBUG
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: z-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate
    # PRIMER DEPLOY CON DATOS:
    # Este comando crea el schema, corre migraciones, ejecuta el seed UNA VEZ y arranca el backend.
    # Despues del primer deploy exitoso, reemplazar este startCommand sacando la linea:
    # npm run db:seed &&
    startCommand: >
      node -e 'const { Client } = require("pg"); const db = process.env.DATABASE_URL; if (!db) throw new Error("DATABASE_URL is required"); const url = new URL(db); const schema = url.searchParams.get("schema"); if (!schema) throw new Error("DATABASE_URL must include ?schema=gonzapp_webservice"); if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(schema)) throw new Error(`Invalid schema: ${schema}`); url.searchParams.delete("schema"); const client = new Client({ connectionString: url.toString() }); client.connect().then(() => client.query(`CREATE SCHEMA IF NOT EXISTS "${schema}"`)).then(() => client.end()).catch((error) => { console.error(error); process.exit(1); });' &&
      npx prisma migrate deploy &&
      npm run db:seed &&
      npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://z-web.onrender.com
      # Cargar en Render la URL de PostgreSQL con un schema separado:
      # postgresql://.../seguros2_db?schema=gonzapp_webservice
      # Esto evita aplicar migraciones sobre el schema public existente.
      - key: DATABASE_URL
        value: 'postgresql://seguros2_db_user:iVpTPyhcuNR2L0eYfU7lwuovs4zM0hPn@dpg-d829vl7avr4c73berimg-a/seguros2_db?schema=gonzapp_webservice'
      - key: JWT_SECRET
        generateValue: true
