previews:
  generation: off

services:
  - type: web
    name: z-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_API_URL
        value: https://z-api-1icl.onrender.com/api
      - key: VITE_DEBUG
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: z-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npx prisma generate
    # Deploy normal despues del primer seed.
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://z-web-70as.onrender.com
      # Cargar en Render la URL de PostgreSQL con schema separado y SSL.
      - key: DATABASE_URL
        value: 'postgresql://seguros2_db_user:iVpTPyhcuNR2L0eYfU7lwuovs4zM0hPn@dpg-d829vl7avr4c73berimg-a.oregon-postgres.render.com/seguros2_db?schema=gonzapp_webservice&sslmode=require'
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_STORAGE
        value: local
      - key: UPLOAD_DIR
        value: /opt/render/project/src/uploads
      # Cloudinary queda listo pero apagado. Para usarlo, cambiar UPLOAD_STORAGE a cloudinary
      # y cargar estas credenciales en Render.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: gonzapp/listings
    # En plan free, los archivos locales de Render son efimeros. Para persistirlos,
    # activar un disk requiere pasar el servicio a un plan pago.
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/uploads
    #   sizeGB: 1
